<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VulcanOS / ISO</title>

    <style>
        :root {
            --outer-bg: #000000;
            --page-bg: #0d1117;
            --toc-bg: #161b22;
            --text: #c9d1d9;
            --heading: #f0f3f6;
            --muted: #8b949e;
            --border: #30363d;
            --red: #ff3b3b;
            --link: #58a6ff;
            --link-hover: #79c0ff;
            --button-bg: #21262d;
            --page-width: 915px;
        }

        body.light {
            --outer-bg: #e6e6e6;
            --page-bg: #ffffff;
            --toc-bg: #f6f8fa;
            --text: #24292f;
            --heading: #1f2328;
            --muted: #57606a;
            --border: #d0d7de;
            --red: #d1242f;
            --link: #0969da;
            --link-hover: #0550ae;
            --button-bg: #f6f8fa;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--outer-bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Helvetica, Arial, sans-serif;
            font-size: 16px;
            line-height: 1.6;
        }

        a {
            color: var(--link);
            text-decoration: none;
        }

        a:hover {
            color: var(--link-hover);
            text-decoration: underline;
        }

        .page {
            width: var(--page-width);
            max-width: calc(100% - 32px);
            min-height: 100vh;
            margin: 0 auto;
            background: var(--page-bg);
            padding: 40px 34px 80px;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--red);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--heading);
        }

        .logo svg {
            width: 27px;
            height: 27px;
        }

        .title {
            font-family: "SFMono-Regular", Consolas, "Liberation Mono",
                         Menlo, monospace;
            font-size: 30px;
            color: var(--heading);
            letter-spacing: -0.5px;
        }

        .title span {
            color: var(--muted);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 18px;
            white-space: nowrap;
        }

        .header-actions a,
        .theme-button {
            font-size: 16px;
            font-weight: 500;
        }

        .theme-button {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 6px 11px;
            background: var(--button-bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 15px;
        }

        .theme-button:hover {
            filter: brightness(1.15);
        }

        .theme-button svg {
            width: 16px;
            height: 16px;
        }

        main {
            margin-top: 55px;
        }

        h2 {
            margin: 0 0 15px;
            padding-bottom: 7px;
            border-bottom: 1px solid var(--border);
            color: var(--heading);
            font-size: 25px;
            line-height: 1.3;
        }

        p {
            font-size: 17px;
        }

        .directory-wrapper {
            margin-top: 25px;
            overflow-x: auto;
            border: 1px solid var(--border);
            border-radius: 4px;
        }

        .directory {
            width: 100%;
            border-collapse: collapse;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono",
                         Menlo, monospace;
            font-size: 14px;
        }

        .directory th {
            padding: 9px 12px;
            background: var(--toc-bg);
            color: var(--heading);
            border-bottom: 1px solid var(--border);
            text-align: left;
            white-space: nowrap;
        }

        .directory td {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        .directory tr:last-child td {
            border-bottom: none;
        }

        .directory tr:hover td {
            background: var(--toc-bg);
        }

        .directory th:first-child,
        .directory td:first-child {
            width: 100%;
        }

        .directory th:nth-child(2),
        .directory td:nth-child(2),
        .directory th:nth-child(3),
        .directory td:nth-child(3) {
            text-align: right;
        }

        .sort {
            color: var(--muted);
            margin-left: 4px;
        }

        .loading {
            color: var(--muted);
            text-align: center;
        }

        .error {
            padding: 15px;
            background: var(--toc-bg);
            border-left: 3px solid var(--red);
            color: var(--text);
        }

        footer {
            margin-top: 70px;
            padding-top: 18px;
            border-top: 1px solid var(--border);
            color: var(--muted);
            font-size: 14px;
        }

        .footer-links {
            display: flex;
            gap: 15px;
            margin-top: 5px;
        }

        @media (max-width: 700px) {
            .page {
                max-width: 100%;
                width: 100%;
                padding: 22px 18px 60px;
            }

            header {
                align-items: flex-start;
                flex-direction: column;
                gap: 15px;
            }

            .header-actions {
                flex-wrap: wrap;
                gap: 12px;
            }

            .title {
                font-size: 24px;
            }

            main {
                margin-top: 45px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <header>

        <div class="brand">

            <div class="logo">
                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="1.8"
                     stroke-linecap="round"
                     stroke-linejoin="round">
                    <path d="M3 20h18"/>
                    <path d="M5 20l4-10 3 4 2-7 5 13"/>
                    <path d="M12 7c0-1.5 1-2.5 1-4"/>
                </svg>
            </div>

            <div class="title">
                VulcanOS <span>/ ISO</span>
            </div>

        </div>

        <nav class="header-actions">

            <button class="theme-button" onclick="toggleTheme()">

                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2">

                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 2v2"/>
                    <path d="M12 20v2"/>
                    <path d="M4.93 4.93l1.41 1.41"/>
                    <path d="M17.66 17.66l1.41 1.41"/>
                    <path d="M2 12h2"/>
                    <path d="M20 12h2"/>
                    <path d="M4.93 19.07l1.41-1.41"/>
                    <path d="M17.66 6.34l1.41-1.41"/>

                </svg>

                <span>Light</span>

            </button>

            <a href="index.html">Wiki</a>
            <a href="https://discord.gg/B2KFTCASUw">Discord</a>

        </nav>

    </header>

    <main>

        <h2>ISO Repository</h2>

        <p>
            Official VulcanOS installation images and related files.
        </p>

        <div class="directory-wrapper">

            <table class="directory">

                <thead>
                    <tr>
                        <th>
                            File Name <span class="sort">↓</span>
                        </th>

                        <th>
                            File Size <span class="sort">↓</span>
                        </th>

                        <th>
                            Date <span class="sort">↓</span>
                        </th>
                    </tr>
                </thead>

                <tbody id="file-list">

                    <tr>
                        <td colspan="3" class="loading">
                            Loading files...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </main>

    <footer>

        <div>VulcanOS ISO Repository</div>

        <div class="footer-links">
            <a href="index.html">Wiki</a>
            <a href="https://discord.gg/B2KFTCASUw">Discord</a>
        </div>

    </footer>

</div>

<script src="iso.js"></script>

</body>
</html>
